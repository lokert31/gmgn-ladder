<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GMGN × Liquidity Ladder — настройки</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#2b3240; --text:#e6edf3; --dim:#9aa4b2; --green:#34d399; --blue:#60a5fa; --red:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; width:380px; max-height:590px; overflow-y:auto; background:var(--bg); color:var(--text);
         font:13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  body.tab { width:auto; max-width:560px; max-height:none; margin:0 auto; }
  header { padding:12px 14px 8px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:8px; }
  header b { font-size:15px; } header span { color:var(--dim); font-size:11px; }
  section { padding:10px 14px; border-bottom:1px solid var(--line); }
  h2 { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); margin:0 0 6px; font-weight:600; }
  label.row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; cursor:pointer; }
  label.row small { color:var(--dim); display:block; font-size:11px; }
  input[type=number] { width:70px; }
  input[type=text] { width:100%; margin-top:3px; }
  input[type=number], input[type=text] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:5px; padding:3px 6px; font:inherit; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  #state { color:var(--dim); font-size:12px; white-space:pre-wrap; }
  .warn { color:var(--red); }
</style>
</head>
<body>
<header><b>Настройки расширения</b><span data-k="ver"></span></header>

<section>
  <h2>Сторож — автосбор и закрытие</h2>
  <label class="row">Сторож включён<small>главный выключатель: без него ничего не жмётся</small><input type="checkbox" data-s="llChart.watchOn"></label>
  <label class="row">Автосбор у верхней границы леддера<input type="checkbox" data-s="llChart.edgeHi"></label>
  <label class="row">Автосбор у нижней границы<input type="checkbox" data-s="llChart.edgeLo"></label>
  <label class="row">Область у границы, %<input type="number" min="0" step="1" data-s="llChart.edgePct"></label>
  <label class="row">Собирать на пампе<input type="checkbox" data-s="llChart.pumpOn"></label>
  <label class="row">Памп: рост, %<input type="number" min="1" step="1" data-s="llChart.pumpPct"></label>
  <label class="row">Памп: за сколько минут<input type="number" min="1" step="1" data-s="llChart.windowMin"></label>
  <label class="row">Собирать по порогу, где бы ни была цена<input type="checkbox" data-s="llChart.feesOn"></label>
  <label class="row">Не собирать меньше, $<input type="number" min="0" step="1" data-s="llChart.minUsd"></label>
  <label class="row">Проверять цену раз в, сек<small>1 секунда на трёх токенах ≈ $5 в день у Alchemy</small><input type="number" min="1" step="1" data-s="llChart.everySec"></label>
  <label class="row">Свои фоновые вкладки<input type="checkbox" data-s="llChart.keepTabs"></label>
  <label class="row">Не больше вкладок (0 — по одной на токен)<input type="number" min="0" step="1" data-s="llChart.maxTabs"></label>
  <div id="state"></div>
  <div class="btns" style="margin-top:6px">
    <button data-a="tabsOpen">открыть вкладки сторожа</button>
    <button data-a="tabsClose">закрыть свои вкладки</button>
  </div>
</section>

<section>
  <h2>GMGN</h2>
  <label class="row">Карточка LP: авторазбор при открытии токена<input type="checkbox" data-s="ghoLpCard.auto"></label>
  <label class="row">Пулы на графике<small>глубина всех пулов токена полосами</small><input type="checkbox" data-s="ghoLpCard.chart"></label>
  <label class="row">Метки пулов в списках<small>«пулы $X · об ×N» в трендах и новых</small><input type="checkbox" data-s="ghoLpCard.lists"></label>
  <label class="row">Метки входа холдеров на графике<input type="checkbox" data-s="ghoConfig.enabled"></label>
  <label class="row">Плашка «Топ-холдеры» свёрнута<input type="checkbox" data-s="ghoConfig.collapsed"></label>
  <label class="row">В списке холдеров — только кто ещё держит<input type="checkbox" data-s="ghoConfig.onlyHolding"></label>
  <div class="btns" style="margin-top:6px"><button data-a="openScreener">скринер пулов ↗</button></div>
</section>

<section>
  <h2>Окно на Liquidity Ladder</h2>
  <label class="row">Ступени леддера заливкой<input type="checkbox" data-s="llChart.mine"></label>
  <label class="row">Границы леддера<input type="checkbox" data-s="llChart.bounds"></label>
  <label class="row">Глубина пула<input type="checkbox" data-s="llChart.depthOn"></label>
  <label class="row">Сайз, мешок и безубыток<input type="checkbox" data-s="llChart.sizeOn"></label>
  <label class="row">Линии входа холдеров<input type="checkbox" data-s="llChart.holders"></label>
  <label class="row">Подтягивать все позиции токена в Manage<input type="checkbox" data-s="llChart.autoLoad"></label>
</section>

<section>
  <h2>Узлы</h2>
  <label>RPC сети<small style="color:var(--dim)"> — основной: события и поиск пулов</small>
    <input type="text" spellcheck="false" placeholder="https://…" data-s="ghoRpc.robinhood"></label>
  <label style="display:block;margin-top:8px">RPC для чтения<small style="color:var(--dim)"> — необязательно, быстрый, например OrbitFlare</small>
    <input type="text" spellcheck="false" placeholder="https://robinhood.rpc.orbitflare.com?api_key=…" data-s="ghoRpc.robinhoodState"></label>
</section>
<script src="menu.js"></script>
</body>
</html>
